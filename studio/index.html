<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOZE Studio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0C12">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DOZE Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="studio.css?v=1.0.0">
</head>
<body>
<header class="top">
  <div class="brand"><img src="../brand/logo-doze.webp" alt="DOZE"><span>Studio</span></div>
  <div class="top-actions" id="top-actions" hidden>
    <div class="seg" id="period" role="group" aria-label="Période">
      <button type="button" data-days="7">7 j</button><button type="button" data-days="30" class="is-on">30 j</button><button type="button" data-days="90">90 j</button><button type="button" data-days="365">1 an</button>
    </div>
    <button class="ic" type="button" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></button>
    <button class="ic" type="button" id="logout" aria-label="Se déconnecter du Studio"><svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5zM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg></button>
  </div>
</header>
<main id="app"><div class="empty">Chargement…</div></main>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="../config.js"></script>
<script src="studio.js?v=1.0.0"></script>
</body>
</html>
